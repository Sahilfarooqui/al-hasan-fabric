services:
  - type: web
    name: al-hasan-fabric
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: al-hasan-fabric-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_PAYMENTS
        value: "true"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYTM_MID
        sync: false
      - key: PAYTM_MERCHANT_KEY
        sync: false
      - key: PAYTM_WEBSITE
        value: DEFAULT
      - key: PAYTM_INDUSTRY_TYPE
        value: Retail
      - key: PAYTM_CHANNEL_ID
        value: WEB
      - key: PAYTM_CALLBACK_URL
        sync: false
      - key: PAYTM_ENV
        value: production

databases:
  - name: al-hasan-fabric-db
    plan: free
    databaseName: alhasanfabric
    user: alhasan
